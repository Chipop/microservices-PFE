# =============================================================================
#  FlowForge — Orchestration complete de la plateforme
#  ---------------------------------------------------------------------------
#  `docker compose up -d --build` demarre l'integralite du systeme :
#
#    - 11 microservices backend (Django x2, NestJS x4, Spring Boot x5)
#    -  9 bases de donnees dediees (7 PostgreSQL + 2 MySQL)
#    -  1 courtier de messages RabbitMQ (bus d'evenements)
#    -  1 moteur Elasticsearch (index de recherche)
#    -  1 passerelle NGINX (unique port applicatif expose : 8080)
#    -  1 frontend SPA (servi PAR la passerelle, aucun port propre)
#
#  Principes d'architecture appliques ici :
#
#  * DATABASE PER SERVICE — chaque microservice possede sa PROPRE base, dans
#    son PROPRE conteneur. Aucun service ne lit la base d'un autre : toute
#    donnee transverse passe par une API ou par un evenement RabbitMQ.
#
#  * DEUX SGBD DIFFERENTS — PostgreSQL pour les services transactionnels
#    fortement relationnels ; MySQL pour les deux services « journaux »
#    (notifications, emails), qui sont en ecriture-ajout et sans jointure.
#    Elasticsearch constitue un troisieme magasin, dedie a la recherche.
#
#  * ACCES UNIQUEMENT PAR LA PASSERELLE — c'est le point important. AUCUN
#    microservice backend et AUCUNE base de donnees ne publie de port sur
#    l'hote : ils n'ont PAS de section `ports:`. Ils restent joignables par
#    NGINX et entre eux via le reseau interne Docker (la communication entre
#    conteneurs n'a jamais besoin d'un port publie), mais il est IMPOSSIBLE de
#    les atteindre depuis l'hote en contournant la passerelle. Un `curl
#    localhost:8003` echoue : seul `localhost:8080` (la passerelle) repond.
#
#    Seuls 3 ports sont publies, et pour de bonnes raisons :
#      - 8080  : la passerelle NGINX — unique porte d'entree applicative
#      - 15672 : la console d'administration de RabbitMQ (exploitation/captures)
#      - 9200  : l'API d'inspection d'Elasticsearch (exploitation/captures)
#    Le port AMQP de RabbitMQ (5672) N'est PAS publie : les services l'utilisent
#    via le reseau interne (`rabbitmq:5672`), pas via l'hote.
#
#  * DEPENDANCES SAINES — `condition: service_healthy` empeche un service de
#    demarrer avant que sa base (ou RabbitMQ) ne reponde reellement, ce qui
#    evite les erreurs de connexion au demarrage a froid.
#
#  NOTE DEBOGAGE — pour inspecter une base pendant le developpement sans rouvrir
#  de port, on passe par le conteneur :
#      docker compose exec tasks-db psql -U todo -d tasks
# =============================================================================

services:

  # ===========================================================================
  #  BASES DE DONNEES — PostgreSQL 16 (7 bases dediees)
  # ===========================================================================

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=auth
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready ne repond OK que lorsque le serveur accepte reellement des
      # connexions : c'est ce qui rend `service_healthy` fiable.
      test: ["CMD-SHELL", "pg_isready -U todo -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=users
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  tasks-db:
    image: postgres:16-alpine
    container_name: tasks-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=tasks
    volumes:
      - tasks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  categories-db:
    image: postgres:16-alpine
    container_name: categories-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=categories
    volumes:
      - categories_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d categories"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  comments-db:
    image: postgres:16-alpine
    container_name: comments-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=comments
    volumes:
      - comments_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d comments"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  workspaces-db:
    image: postgres:16-alpine
    container_name: workspaces-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=workspaces
    volumes:
      - workspaces_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d workspaces"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  attachments-db:
    image: postgres:16-alpine
    container_name: attachments-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=attachments
    volumes:
      - attachments_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d attachments"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  # ===========================================================================
  #  BASES DE DONNEES — MySQL 8 (2 bases dediees)
  #  ---------------------------------------------------------------------------
  #  Le cahier des charges impose au minimum DEUX SGBD differents. Nous avons
  #  choisi de basculer sur MySQL les deux services dont le modele s'y prete le
  #  mieux : ce sont des JOURNAUX (notifications recues, emails envoyes) —
  #  ecriture-ajout, lecture par cle, aucune jointure complexe, aucun besoin des
  #  types avances de PostgreSQL. Ce ne sont pas des bases « au hasard ».
  # ===========================================================================

  notifications-db:
    image: mysql:8
    container_name: notifications-db
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=notifications
      - MYSQL_USER=todo
      - MYSQL_PASSWORD=todo
    volumes:
      - notifications_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u todo -ptodo --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [flowforge-platform-network]

  emails-db:
    image: mysql:8
    container_name: emails-db
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=emails
      - MYSQL_USER=todo
      - MYSQL_PASSWORD=todo
    volumes:
      - emails_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u todo -ptodo --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [flowforge-platform-network]

  # ===========================================================================
  #  INFRASTRUCTURE — bus d'evenements et moteur de recherche
  # ===========================================================================

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: flowforge-rabbitmq
    hostname: flowforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: flowforge
      RABBITMQ_DEFAULT_PASS: flowforge_password
      RABBITMQ_DEFAULT_VHOST: flowforge
    ports:
      - "15672:15672"  # console d'administration web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [flowforge-platform-network]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: flowforge-elasticsearch
    environment:
      - discovery.type=single-node       # noeud unique : suffisant en dev
      - xpack.security.enabled=false     # pas de TLS/auth en local
      - ES_JAVA_OPTS=-Xms512m -Xmx512m   # bride la JVM, sinon ES prend 50% de la RAM
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [flowforge-platform-network]

  # ===========================================================================
  #  MICROSERVICES — perimetre exige par le cahier des charges
  # ===========================================================================

  # --- 1. Auth-Service --------------------------------------------------------
  # Django + DRF. Emet les JWT (HS256) signes avec JWT_SIGNING_KEY, secret
  # PARTAGE par tous les services : chacun peut valider un jeton localement,
  # sans appeler l'auth-service. C'est ce qui rend l'authentification sans etat.
  auth-service:
    build: ./server/auth-service
    container_name: auth-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - POSTGRES_HOST=auth-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  # --- 2. User-Service --------------------------------------------------------
  # Django + DRF. Consomme « user.registered » pour creer automatiquement le
  # profil a l'inscription (voir entrypoint.sh : le consommateur tourne en
  # tache de fond a cote du serveur HTTP).
  user-service:
    build: ./server/user-service
    container_name: user-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - POSTGRES_HOST=users-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=users
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - PROFILE_STORAGE_BACKEND=azure
      - AZURE_STORAGE_CONTAINER=flowforge-bucket
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - PROFILE_PICTURE_MAX_BYTES=2097152
      - PROFILE_PICTURE_ALLOWED_CONTENT_TYPES=image/jpeg,image/png,image/webp
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
      - RABBITMQ_EXCHANGE=flowforge.events
      - USER_EVENTS_QUEUE=user-service.events
      - USER_EVENTS_DLX=user-service.events.dlx
      - USER_EVENTS_DLQ=user-service.events.dlq
      - USER_EVENTS_DLQ_ROUTING_KEY=user-service.events.failed
      - USER_EVENTS_MAX_ATTEMPTS=3
      - USER_EVENTS_RETRY_BACKOFF_MS=1000
    depends_on:
      users-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  # --- 3. TODO-Service (task-service) -----------------------------------------
  # NestJS + TypeORM. Coeur metier : taches, sous-taches, tags, assignations,
  # dependances, rappels, colonnes kanban, journal d'activite.
  # DEADLINE_SCAN_CRON pilote l'ordonnanceur qui publie
  # « task.deadline_approaching » (fonctionnalite bonus).
  task-service:
    build: ./server/task-service
    container_name: task-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - PORT=8000
      - POSTGRES_HOST=tasks-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tasks
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - TASK_SCHEMA_SYNC=true
      - WORKSPACE_SERVICE_BASE_URL=http://workspace-service:8000
      - CATEGORY_SERVICE_BASE_URL=http://category-service:8000
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
      - RABBITMQ_EXCHANGE=flowforge.events
      # Bonus : balayage horaire des echeances a moins de 24 h
      - DEADLINE_SCAN_CRON=0 0 * * * *
      - DEADLINE_WINDOW_HOURS=24
    depends_on:
      tasks-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      category-service:
        condition: service_started
    networks: [flowforge-platform-network]

  # --- 4. Category-Service ----------------------------------------------------
  # NestJS + TypeORM. Categories, membres, invitations. Les roles du workspace
  # sont HERITES (OWNER -> CATEGORY_OWNER, MEMBER -> CONTRIBUTOR...), mais une
  # adhesion explicite a une categorie donne acces a CETTE categorie seulement.
  category-service:
    build: ./server/category-service
    container_name: category-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - PORT=8000
      - POSTGRES_HOST=categories-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=categories
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - CATEGORY_SCHEMA_SYNC=true
      - CATEGORY_INVITATION_TTL_HOURS=168
      - WORKSPACE_SERVICE_BASE_URL=http://workspace-service:8000
      - USER_SERVICE_BASE_URL=http://user-service:8000
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
      - RABBITMQ_EXCHANGE=flowforge.events
    depends_on:
      categories-db:
        condition: service_healthy
      workspace-service:
        condition: service_started
      user-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  # --- 5. Comment-Service -----------------------------------------------------
  # NestJS + TypeORM. Ne stocke AUCUNE donnee de tache : il interroge
  # task-service (GET /api/tasks/{id}/permissions) pour savoir si l'appelant a
  # le droit de voir la tache commentee. La securite n'est donc jamais dupliquee.
  comment-service:
    build: ./server/comment-service
    container_name: comment-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - PORT=8000
      - POSTGRES_HOST=comments-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=comments
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - COMMENT_SCHEMA_SYNC=true
      - TASK_SERVICE_BASE_URL=http://task-service:8000
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
      - RABBITMQ_EXCHANGE=flowforge.events
    depends_on:
      comments-db:
        condition: service_healthy
      task-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  # --- 6. Statistics-Service --------------------------------------------------
  # NestJS. SEUL service SANS base de donnees, et c'est deliberé : il ne
  # POSSEDE aucune donnee. Il rejoue le jeton JWT de l'utilisateur aupres du
  # task-service, n'obtient donc que les taches qu'il a le droit de voir, et
  # agrege le resultat en memoire. Aucune duplication, aucune desynchronisation.
  statistics-service:
    build: ./server/statistics-service
    container_name: statistics-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - PORT=8000
      - TASK_SERVICE_BASE_URL=http://task-service:8000
    depends_on:
      task-service:
        condition: service_started
    networks: [flowforge-platform-network]

  # --- 7. Notification-Service (BONUS) ----------------------------------------
  # Spring Boot + MySQL + WebSocket. Consomme les evenements porteurs de
  # destinataires et pousse la notification en temps reel via /ws/notifications.
  # L'unicite (source_event_id, recipient, type) rend le rejeu idempotent.
  notification-service:
    build: ./server/notification-service
    container_name: notification-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - PORT=8000
      # >>> MySQL (et non PostgreSQL) — cf. contrainte « 2 SGBD differents »
      - MYSQL_HOST=notifications-db
      - MYSQL_PORT=3306
      - MYSQL_DB=notifications
      - MYSQL_USER=todo
      - MYSQL_PASSWORD=todo
      - CORS_ALLOWED_ORIGINS=*
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
      - RABBITMQ_EXCHANGE=flowforge.events
      - NOTIFICATION_QUEUE=notification-service.events
      - NOTIFICATION_DLX=notification-service.events.dlx
      - NOTIFICATION_DLQ=notification-service.events.dlq
      - NOTIFICATION_DLQ_ROUTING_KEY=notification-service.events.failed
      - NOTIFICATION_MAX_ATTEMPTS=3
      - NOTIFICATION_RETRY_BACKOFF_MS=1000
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  # ===========================================================================
  #  MICROSERVICES — au-dela du cahier des charges
  # ===========================================================================

  workspace-service:
    build: ./server/workspace-service
    container_name: workspace-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - PORT=8000
      - POSTGRES_HOST=workspaces-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=workspaces
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - WORKSPACE_INVITATION_TTL_HOURS=168
      - CORS_ALLOWED_ORIGINS=*
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
      - RABBITMQ_EXCHANGE=flowforge.events
      - WORKSPACE_QUEUE=workspace-service.events
      - WORKSPACE_DLX=workspace-service.events.dlx
      - WORKSPACE_DLQ=workspace-service.events.dlq
      - WORKSPACE_DLQ_ROUTING_KEY=workspace-service.events.failed
      - WORKSPACE_MAX_ATTEMPTS=3
      - WORKSPACE_RETRY_BACKOFF_MS=1000
    depends_on:
      workspaces-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  attachment-service:
    build: ./server/attachment-service
    container_name: attachment-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - PORT=8000
      - POSTGRES_HOST=attachments-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=attachments
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - CORS_ALLOWED_ORIGINS=*
      - TASK_SERVICE_BASE_URL=http://task-service:8000
      # Les OCTETS des fichiers vont dans Azure Blob Storage ;
      # seules les METADONNEES sont en base. La base ne grossit donc pas
      # avec le volume des pieces jointes.
      - AZURE_STORAGE_CONTAINER=flowforge-bucket
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - ATTACHMENT_MAX_BYTES=10485760
      - ATTACHMENT_ALLOWED_CONTENT_TYPES=image/jpeg,image/png,image/webp,application/pdf,text/plain
      - ATTACHMENT_SIGNED_URL_TTL_SECONDS=900
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
    depends_on:
      attachments-db:
        condition: service_healthy
      task-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  email-service:
    build: ./server/email-service
    container_name: email-service
    environment:
      - PORT=8000
      # >>> MySQL (et non PostgreSQL) — cf. contrainte « 2 SGBD differents »
      - MYSQL_HOST=emails-db
      - MYSQL_PORT=3306
      - MYSQL_DB=emails
      - MYSQL_USER=todo
      - MYSQL_PASSWORD=todo
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
      - RABBITMQ_EXCHANGE=flowforge.events
      - EMAIL_QUEUE=email-service.events
      - EMAIL_DLX=email-service.events.dlx
      - EMAIL_DLQ=email-service.events.dlq
      - EMAIL_DLQ_ROUTING_KEY=email-service.events.failed
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS:-3}
      - EMAIL_RETRY_BACKOFF_MS=${EMAIL_RETRY_BACKOFF_MS:-1000}
      # Parametres SMTP fournis par l'environnement de l'hote (jamais versionnes)
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@flowforge.local}
      - SMTP_AUTH_ENABLED=${SMTP_AUTH_ENABLED:-true}
      - SMTP_STARTTLS_ENABLED=${SMTP_STARTTLS_ENABLED:-true}
    depends_on:
      emails-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  search-service:
    build: ./server/search-service
    container_name: search-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - PORT=8000
      - CORS_ALLOWED_ORIGINS=*
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
      - RABBITMQ_EXCHANGE=flowforge.events
      - SEARCH_QUEUE=search-service.events
      - SEARCH_DLX=search-service.events.dlx
      - SEARCH_DLQ=search-service.events.dlq
      - SEARCH_DLQ_ROUTING_KEY=search-service.events.failed
      # URLs utilisees UNIQUEMENT par la reconstruction d'index
      # (POST /api/search/internal/reindex), pas par les requetes courantes.
      - TASK_SERVICE_BASE_URL=http://task-service:8000
      - COMMENT_SERVICE_BASE_URL=http://comment-service:8000
      - CATEGORY_SERVICE_BASE_URL=http://category-service:8000
      - WORKSPACE_SERVICE_BASE_URL=http://workspace-service:8000
      - USER_SERVICE_BASE_URL=http://user-service:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks: [flowforge-platform-network]

  # ===========================================================================
  #  FRONTEND + PASSERELLE
  # ===========================================================================

  # La SPA est construite par Vite puis servie par un NGINX minimal sur le port
  # 9000 — port INTERNE au reseau Docker. Aucun `ports:` n'est declare :
  # l'application n'est donc JOIGNABLE QUE par la passerelle, conformement a la
  # contrainte « frontend accessible via l'API Gateway uniquement ».
  frontend:
    build:
      context: ./ui
      args:
        # La SPA appelle la passerelle, jamais un service directement.
        VITE_GATEWAY_URL: http://localhost:8080
        VITE_USE_MOCKS: "false"
    container_name: frontend
    networks: [flowforge-platform-network]

  # Unique porte d'entree publique de toute la plateforme.
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    volumes:
      - ./server/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - auth-service
      - user-service
      - task-service
      - category-service
      - comment-service
      - statistics-service
      - notification-service
      - workspace-service
      - attachment-service
      - search-service
    networks: [flowforge-platform-network]

# =============================================================================
#  VOLUMES — les donnees survivent a `docker compose down`
#  (utiliser `docker compose down -v` pour repartir d'une base vierge)
# =============================================================================
volumes:
  auth_pgdata:
  users_pgdata:
  tasks_pgdata:
  categories_pgdata:
  comments_pgdata:
  workspaces_pgdata:
  attachments_pgdata:
  notifications_mysqldata:
  emails_mysqldata:
  rabbitmq_data:
  elasticsearch_data:

# =============================================================================
#  RESEAU — un reseau bridge dedie. Les conteneurs se resolvent entre eux par
#  leur NOM DE SERVICE grace au DNS embarque de Docker (ex. « task-service »).
# =============================================================================
networks:
  flowforge-platform-network:
    name: flowforge-platform-network
    driver: bridge

# =============================================================================
#  FlowForge — API Gateway (NGINX)
#  ---------------------------------------------------------------------------
#  Point d'entree PUBLIC UNIQUE de la plateforme. Le navigateur ne parle jamais
#  a un microservice directement : il ne connait que http://localhost:8080.
#
#  Deux responsabilites :
#    1. Servir l'application frontend (SPA Vue 3) depuis la racine « / ».
#    2. Faire office de reverse proxy pour CHAQUE microservice backend,
#       en routant par prefixe d'URL sur le reseau interne Docker
#       « flowforge-platform-network ».
#
#  Les noms d'hote (auth-service, task-service, ...) sont resolus par le DNS
#  embarque de Docker Compose : ce sont les noms de service du fichier
#  docker-compose.yml. Aucun port interne n'est expose sur l'hote.
#
#  CORS : deliberement NON gere ici. Chaque service applique sa propre
#  politique (middleware Django, app.enableCors() NestJS, CORS_ALLOWED_ORIGINS
#  cote Spring) ; NGINX se contente de relayer les en-tetes et les requetes
#  preflight OPTIONS. Cela evite d'avoir deux sources de verite pour CORS.
# =============================================================================

events {}

http {
    # -------------------------------------------------------------------------
    # Definition des upstreams — un par microservice backend, plus le conteneur
    # qui sert la SPA. Tous ecoutent sur le port 8000 a l'interieur du reseau.
    # -------------------------------------------------------------------------
    upstream frontend_app        { server frontend:9000; }

    upstream auth_service        { server auth-service:8000; }
    upstream profiles_service    { server user-service:8000; }
    upstream tasks_service       { server task-service:8000; }
    upstream category_service    { server category-service:8000; }
    upstream comment_service     { server comment-service:8000; }
    upstream statistics_service  { server statistics-service:8000; }
    upstream workspace_service   { server workspace-service:8000; }
    upstream attachment_service  { server attachment-service:8000; }
    upstream notification_service { server notification-service:8000; }
    upstream search_service      { server search-service:8000; }

    # -------------------------------------------------------------------------
    # En-tetes de proxy communs a toutes les locations.
    #
    # On force « Host » a l'hote demande par le client (et non au nom interne
    # de l'upstream) : sans cela, ALLOWED_HOSTS de Django rejetterait les
    # requetes, puisqu'il verrait « auth-service » au lieu de « localhost ».
    #
    # X-Forwarded-For / X-Forwarded-Proto permettent aux services de connaitre
    # l'IP reelle du client et le schema d'origine malgre le proxy.
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Les televersements de pieces jointes peuvent atteindre 10 Mo cote
    # attachment-service. La valeur par defaut de NGINX (1 Mo) provoquerait
    # une erreur 413 avant meme d'atteindre le service.
    client_max_body_size 10m;

    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------------
        # 1) LE FRONTEND EST SERVI DEPUIS LA RACINE.
        #
        # Toute URL qui ne commence pas par /api/ ou /ws/ est transmise au
        # conteneur « frontend », qui renvoie la SPA (avec son propre fallback
        # try_files vers index.html pour le routage cote client en mode
        # history). L'utilisateur n'accede donc JAMAIS a la SPA autrement que
        # par la passerelle : le conteneur frontend ne publie aucun port.
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_app;
        }

        # Sonde de sante de la passerelle elle-meme (utile pour docker healthcheck
        # ou un simple `curl localhost:8080/healthz`).
        location = /healthz {
            default_type text/plain;
            return 200 "gateway ok\n";
        }

        # ---------------------------------------------------------------------
        # 2) REVERSE PROXY — un bloc par microservice backend.
        #
        # Le prefixe est conserve tel quel (aucune reecriture) : chaque service
        # NestJS/Django/Spring expose deja ses routes sous /api/<domaine>/.
        # ---------------------------------------------------------------------

        # --- Services du perimetre exige par le cahier des charges ------------

        # 1. Auth-Service : inscription, connexion, JWT, sessions, 2FA
        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        # 2. User-Service : profils utilisateurs (photo, bio, preferences)
        location /api/profiles/ {
            proxy_pass http://profiles_service;
        }

        # 3. TODO-Service : CRUD des taches, sous-taches, tags, assignations
        location /api/tasks/ {
            proxy_pass http://tasks_service;
        }

        # 4. Category-Service : categories, membres, invitations
        location /api/categories/ {
            proxy_pass http://category_service;
        }

        # 5. Comment-Service : commentaires sur les taches
        location /api/comments/ {
            proxy_pass http://comment_service;
        }

        # 6. Statistics-Service : taux de completion, repartitions, tendances
        location /api/statistics/ {
            proxy_pass http://statistics_service;
        }

        # 7. Notification-Service (BONUS) : notifications in-app.
        #    Deux blocs : le « = » capte /api/notifications sans slash final,
        #    que le frontend appelle pour la liste paginee.
        location = /api/notifications {
            proxy_pass http://notification_service;
        }

        location /api/notifications/ {
            proxy_pass http://notification_service;
        }

        # --- Services hors perimetre (valeur ajoutee) -------------------------

        location /api/workspaces/ {
            proxy_pass http://workspace_service;
        }

        location /api/attachments/ {
            proxy_pass http://attachment_service;
        }

        location = /api/search {
            proxy_pass http://search_service;
        }

        location /api/search/ {
            proxy_pass http://search_service;
        }

        # ---------------------------------------------------------------------
        # 3) WEBSOCKET — notifications temps reel.
        #
        # Une connexion WebSocket commence par une requete HTTP portant
        # « Upgrade: websocket ». NGINX ne relaie PAS cet en-tete par defaut :
        # il faut le reinjecter explicitement, sinon le handshake echoue.
        #
        # proxy_read_timeout est porte a 1h : sans cela NGINX fermerait la
        # socket au bout de 60 s d'inactivite, alors qu'une session de
        # notification reste ouverte tant que l'onglet est ouvert.
        # ---------------------------------------------------------------------
        location /ws/notifications {
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
            proxy_pass http://notification_service;
        }
    }
}

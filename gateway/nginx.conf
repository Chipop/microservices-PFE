# ---------------------------------------------------------------------------
# API Gateway — single public entry point for the TODO microservice platform.
#
# The browser (and any client) only ever talks to this gateway on port 8080.
# nginx then routes by URL prefix to the right Django service on the internal
# todonet network:
#
#     /api/auth/      ->  auth-django    (registration, login, JWT refresh)
#     /api/profiles/  ->  users-django   (profiles)
#     /api/todos/     ->  todos-nestjs   (JWT-scoped CRUD; replaced todos-django)
#
# CORS is handled by each service (Django middleware / NestJS enableCors); nginx
# transparently passes those headers (and the preflight OPTIONS) back.
# ---------------------------------------------------------------------------

events {}

http {
    # Upstreams resolved by Docker's embedded DNS using the compose service /
    # container names on the shared `todonet` network.
    upstream auth_service     { server host.docker.internal:8002; }
    upstream profiles_service { server host.docker.internal:8001; }
    upstream todos_service    { server host.docker.internal:8003; }  # todos-nestjs

    # Common proxy headers. We force Host to the original client host so Django's
    # ALLOWED_HOSTS (localhost under DEBUG) keeps accepting requests instead of
    # seeing the internal upstream name.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;
 
        # Small health probe so `curl localhost:8080/` says something useful.
        location = / {
            default_type text/plain;
            return 200 "API Gateway up. Routes: /api/auth/  /api/profiles/  /api/todos/\n";
        }

        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location /api/profiles/ {
            proxy_pass http://profiles_service;
        }

        location /api/todos/ {
            proxy_pass http://todos_service;
        }
    }
}

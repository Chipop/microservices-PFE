services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=auth
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=users
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  tasks-db:
    image: postgres:16-alpine
    container_name: tasks-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=tasks
    volumes:
      - tasks_pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  workspaces-db:
    image: postgres:16-alpine
    container_name: workspaces-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=workspaces
    volumes:
      - workspaces_pgdata:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d workspaces"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  attachments-db:
    image: postgres:16-alpine
    container_name: attachments-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=attachments
    volumes:
      - attachments_pgdata:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d attachments"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  notifications-db:
    image: postgres:16-alpine
    container_name: notifications-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=notifications
    volumes:
      - notifications_pgdata:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flowforge-platform-network]

  user-service:
    build: ./server/user-service
    container_name: user-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - POSTGRES_HOST=users-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=users
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - PROFILE_STORAGE_BACKEND=azure
      - AZURE_STORAGE_CONTAINER=flowforge-bucket
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - PROFILE_PICTURE_MAX_BYTES=2097152
      - PROFILE_PICTURE_ALLOWED_CONTENT_TYPES=image/jpeg,image/png,image/webp
      - PROFILE_PICTURE_SIGNED_URL_TTL_SECONDS=900
      - PROFILE_PICTURE_KEY_PREFIX=profile-pictures
    volumes:
      - ./server/user-service:/app
    ports:
      - "8001:8000"
    depends_on:
      users-db:
        condition: service_healthy
    networks: [flowforge-platform-network]

  auth-service:
    build: ./server/auth-service
    container_name: auth-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      # Auth reaches the Profiles service THROUGH the gateway (réception call).
      - GATEWAY_URL=http://api-gateway
      - POSTGRES_HOST=auth-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
    volumes:
      - ./server/auth-service:/app
    ports:
      - "8002:8000"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  # --- legacy-todo-service 
  # legacy-todo-service:
  #   build: ./server/legacy-todo-service
  #   container_name: legacy-todo-service
  #   environment:
  #     - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
  #     - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
  #   volumes:
  #     - ./server/legacy-todo-service:/app
  #   ports:
  #     - "8003:8000"
  #   networks: [flowforge-platform-network]

  task-service:
    build: ./server/task-service
    container_name: task-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - PORT=8000
      - POSTGRES_HOST=tasks-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tasks
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - TASK_SCHEMA_SYNC=true
      - WORKSPACE_SERVICE_BASE_URL=http://workspace-service:8000
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
    ports:
      - "8003:8000"
    depends_on:
      tasks-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  workspace-service:
    build: ./server/workspace-service
    container_name: workspace-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - PORT=8000
      - POSTGRES_HOST=workspaces-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=workspaces
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - WORKSPACE_INVITATION_TTL_HOURS=168
      - CORS_ALLOWED_ORIGINS=*
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
    ports:
      - "8004:8000"
    depends_on:
      workspaces-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  attachment-service:
    build: ./server/attachment-service
    container_name: attachment-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - PORT=8000
      - POSTGRES_HOST=attachments-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=attachments
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - CORS_ALLOWED_ORIGINS=*
      - TASK_SERVICE_BASE_URL=http://task-service:8000
      - AZURE_STORAGE_CONTAINER=flowforge-bucket
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - ATTACHMENT_MAX_BYTES=10485760
      - ATTACHMENT_ALLOWED_CONTENT_TYPES=image/jpeg,image/png,image/webp,application/pdf,text/plain
      - ATTACHMENT_SIGNED_URL_TTL_SECONDS=900
      - ATTACHMENT_KEY_PREFIX=attachments
      - RABBITMQ_URL=amqp://flowforge:flowforge_password@rabbitmq:5672/flowforge
    ports:
      - "8005:8000"
    depends_on:
      attachments-db:
        condition: service_healthy
      task-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [flowforge-platform-network]

  notification-service:
    build: ./server/notification-service
    container_name: notification-service
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - PORT=8000
      - POSTGRES_HOST=notifications-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=notifications
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - CORS_ALLOWED_ORIGINS=*
    ports:
      - "8006:8000"
    depends_on:
      notifications-db:
        condition: service_healthy
    networks: [flowforge-platform-network]

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    volumes:
      - ./server/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - user-service
      - task-service
      - workspace-service
      - attachment-service
      - notification-service
    networks: [flowforge-platform-network]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GATEWAY_URL: http://localhost:8080
    container_name: frontend
    ports:
      - "9000:9000"
    depends_on:
      - api-gateway
    networks: [flowforge-platform-network]
  
  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: flowforge-rabbitmq
    hostname: flowforge-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: flowforge
      RABBITMQ_DEFAULT_PASS: flowforge_password
      RABBITMQ_DEFAULT_VHOST: flowforge

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - flowforge-platform-network

    restart: unless-stopped

volumes:
  auth_pgdata:
  users_pgdata:
  tasks_pgdata:
  workspaces_pgdata:
  attachments_pgdata:
  notifications_pgdata:
  rabbitmq_data:

networks:
  flowforge-platform-network:
    name: flowforge-platform-network
    driver: bridge

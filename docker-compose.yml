services:
  # --- One database PER microservice (true database-per-service). Each owns its
  #     own Postgres container, volume, and host port. Services share nothing. ---
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=auth
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [todonet]

  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=users
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [todonet]

  todos-db:
    image: postgres:16-alpine
    container_name: todos-db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=todos
    volumes:
      - todos_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [todonet]

  users_django:
    build: ./users_django
    container_name: users-django
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      - POSTGRES_HOST=users-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=users
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
    volumes:
      - ./users_django:/app
    ports:
      - "8001:8000"
    depends_on:
      users-db:
        condition: service_healthy
    networks: [todonet]

  auth_django:
    build: ./auth_django
    container_name: auth-django
    environment:
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
      # Auth reaches the Profiles service THROUGH the gateway (réception call).
      - GATEWAY_URL=http://gateway
      - POSTGRES_HOST=auth-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
    volumes:
      - ./auth_django:/app
    ports:
      - "8002:8000"
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [todonet]

  # --- todos_django REPLACED by todos_nestjs (kept here, commented, still works
  #     if you ever swap back). The NestJS service below takes over host port
  #     8003, so the gateway upstream (host.docker.internal:8003) is unchanged. ---
  # todos_django:
  #   build: ./todos_django
  #   container_name: todos-django
  #   environment:
  #     - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
  #     - INTERNAL_API_KEY=INTERNAL-CHANGE-ME
  #   volumes:
  #     - ./todos_django:/app
  #   ports:
  #     - "8003:8000"
  #   networks: [todonet]

  todos_nestjs:
    build: ./todos_nestjs
    container_name: todos-nestjs
    environment:
      # Same shared secret + HS256 + `user_id` claim as auth_django issues.
      - JWT_SIGNING_KEY=this-is-a-much-longer-shared-secret-key-32plus
      - PORT=8000
      - POSTGRES_HOST=todos-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=todos
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
    ports:
      - "8003:8000"
    depends_on:
      todos-db:
        condition: service_healthy
    networks: [todonet]

  # API Gateway — the single public entry point. Routes /api/auth, /api/profiles
  # and /api/todos to the right service. Clients only need this one origin.
  gateway:
    image: nginx:alpine
    container_name: api-gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth_django
      - users_django
      - todos_nestjs
    networks: [todonet]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  auth_pgdata:
  users_pgdata:
  todos_pgdata:

networks:
  todonet:

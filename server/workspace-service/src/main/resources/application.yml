server:
  port: ${PORT:8000}

spring:
  application:
    name: workspace-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:workspaces}
    username: ${POSTGRES_USER:todo}
    password: ${POSTGRES_PASSWORD:todo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

workspace:
  jwt-signing-key: ${JWT_SIGNING_KEY}
  invitation-ttl-hours: ${WORKSPACE_INVITATION_TTL_HOURS:168}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  internal-api-key: ${INTERNAL_API_KEY:}

events:
  exchange: ${RABBITMQ_EXCHANGE:flowforge.events}
  queue: ${WORKSPACE_QUEUE:workspace-service.events}
  dead-letter-exchange: ${WORKSPACE_DLX:workspace-service.events.dlx}
  dead-letter-queue: ${WORKSPACE_DLQ:workspace-service.events.dlq}
  dead-letter-routing-key: ${WORKSPACE_DLQ_ROUTING_KEY:workspace-service.events.failed}
  max-attempts: ${WORKSPACE_MAX_ATTEMPTS:3}
  retry-backoff-ms: ${WORKSPACE_RETRY_BACKOFF_MS:1000}
  routing-keys:
    - user.registered

rabbitmq:
  url: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672/}

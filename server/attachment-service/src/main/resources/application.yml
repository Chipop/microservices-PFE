server:
  port: ${PORT:8000}

spring:
  application:
    name: attachment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:attachments}
    username: ${POSTGRES_USER:todo}
    password: ${POSTGRES_PASSWORD:todo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_BYTES:10485760}
      max-request-size: ${ATTACHMENT_MAX_BYTES:10485760}

attachment:
  jwt-signing-key: ${JWT_SIGNING_KEY}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  task-service-base-url: ${TASK_SERVICE_BASE_URL:http://task-service:8000}
  max-bytes: ${ATTACHMENT_MAX_BYTES:10485760}
  allowed-content-types: ${ATTACHMENT_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,application/pdf,text/plain}
  signed-url-ttl-seconds: ${ATTACHMENT_SIGNED_URL_TTL_SECONDS:900}
  storage:
    azure-container: ${AZURE_STORAGE_CONTAINER}
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    account-url: ${AZURE_STORAGE_ACCOUNT_URL:}
    account-name: ${AZURE_STORAGE_ACCOUNT_NAME:}
    account-key: ${AZURE_STORAGE_ACCOUNT_KEY:}
    key-prefix: ${ATTACHMENT_KEY_PREFIX:attachments}

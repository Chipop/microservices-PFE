# ---------------------------------------------------------------------------
# API Gateway — single public entry point for the task microservice platform.
#
# The browser (and any client) only ever talks to this gateway on port 8080.
# nginx then routes by URL prefix to the right service on the internal
# todonet network:
#
#     /api/auth/      ->  auth-service  (registration, login, JWT refresh)
#     /api/profiles/  ->  user-service  (profiles)
#     /api/tasks/     ->  task-service  (JWT-scoped task management)
#     /api/workspaces/ -> workspace-service (workspace membership)
#     /api/attachments/ -> attachment-service (file attachments)
#     /api/notifications/ -> notification-service (in-app notifications)
#     /ws/notifications -> notification-service (notification websocket)
#     /api/search/ -> search-service (global search)
#
# CORS is handled by each service (Django middleware / NestJS enableCors); nginx
# transparently passes those headers (and the preflight OPTIONS) back.
# ---------------------------------------------------------------------------

events {}

http {
    # Upstreams resolved by Docker's embedded DNS using the compose service /
    # container names on the shared `todonet` network.
    upstream auth_service     { server auth-service:8000; }
    upstream profiles_service { server user-service:8000; }
    upstream tasks_service    { server task-service:8000; }
    upstream workspace_service { server workspace-service:8000; }
    upstream attachment_service { server attachment-service:8000; }
    upstream notification_service { server notification-service:8000; }
    upstream search_service { server search-service:8000; }

    # Common proxy headers. We force Host to the original client host so Django's
    # ALLOWED_HOSTS (localhost under DEBUG) keeps accepting requests instead of
    # seeing the internal upstream name.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;
 
        # Small health probe so `curl localhost:8080/` says something useful.
        location = / {
            default_type text/plain;
            return 200 "API Gateway up. Routes: /api/auth/  /api/profiles/  /api/tasks/  /api/workspaces/  /api/attachments/  /api/notifications/  /api/search/\n";
        }

        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location /api/profiles/ {
            proxy_pass http://profiles_service;
        }

        location /api/tasks/ {
            proxy_pass http://tasks_service;
        }

        location /api/workspaces/ {
            proxy_pass http://workspace_service;
        }

        location /api/attachments/ {
            proxy_pass http://attachment_service;
        }

        location = /api/notifications {
            proxy_pass http://notification_service;
        }

        location /api/notifications/ {
            proxy_pass http://notification_service;
        }

        location /ws/notifications {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
            proxy_pass http://notification_service;
        }

        location = /api/search {
            proxy_pass http://search_service;
        }

        location /api/search/ {
            proxy_pass http://search_service;
        }
    }
}
